<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Cairo;font-weight:400;src:url(fonts/cairo-arabic-400-normal.woff2);unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:Cairo;font-weight:700;src:url(fonts/cairo-arabic-700-normal.woff2);unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:Cairo;font-weight:400;src:url(fonts/cairo-latin-400-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:Cairo;font-weight:700;src:url(fonts/cairo-latin-700-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F,U+2212}
:root{--ink:#10203f;--mut:#4d5f86;--bl:#2563eb}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:Cairo,'DejaVu Sans',sans-serif;color:var(--ink);background:transparent}
body.card{width:1920px;height:1080px;overflow:hidden;background:linear-gradient(160deg,#f3f8ff,#dbe8f8);position:relative}
body.card.v{width:1080px;height:1920px}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(70,110,180,.12) 2px,transparent 2px),linear-gradient(90deg,rgba(70,110,180,.12) 2px,transparent 2px);background-size:60px 60px}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:0 90px}
.logo{width:300px;height:300px;border-radius:50%;box-shadow:0 18px 50px rgba(40,70,130,.35);background:#fff}
.v .logo{width:340px;height:340px}
.h1{font-size:50px;font-weight:700;line-height:1.3;color:var(--mut)}
.brand{font-size:96px;font-weight:700;line-height:1.1;letter-spacing:1px;color:var(--ink)}
.v .brand{font-size:84px}.v .h1{font-size:46px}
.sub{font-size:44px;font-weight:700;color:var(--bl);line-height:1.4}
.sub2{font-size:36px;color:var(--mut)}
.url{display:inline-flex;align-items:center;gap:16px;background:var(--bl);color:#fff;font-weight:700;font-size:54px;padding:12px 46px;border-radius:99px;box-shadow:0 14px 34px rgba(37,99,235,.4);direction:ltr}
.v .url{font-size:46px}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:1500px}
.v .chips{max-width:940px}
.chip{background:#fff;border:2px solid rgba(40,70,130,.22);border-radius:99px;padding:6px 24px;font-size:30px;font-weight:700;box-shadow:0 6px 16px rgba(40,70,130,.15)}
.wm{display:inline-flex;flex-direction:column;align-items:center;gap:6px;padding:0}
.wm img{width:112px;height:112px;border-radius:50%;box-shadow:0 6px 18px rgba(40,70,130,.35);background:#fff}
.wm span{background:rgba(255,255,255,.94);border:1.5px solid rgba(40,70,130,.25);color:#10203f;font-weight:700;font-size:19px;padding:3px 14px;border-radius:99px;direction:ltr;white-space:nowrap}
.banner{display:inline-flex;align-items:center;gap:16px;background:rgba(255,255,255,.96);border:2.5px solid #2563eb;border-radius:99px;padding:8px 30px 10px;font-size:34px;font-weight:700;color:#10203f;box-shadow:0 10px 28px rgba(40,70,130,.3);white-space:nowrap}
.banner b{color:#2563eb;direction:ltr}
.banner.v{font-size:29px;padding:8px 22px 10px}
</style></head><body></body></html>
